name: Page tests

# Runs every Playwright page test (Bungie mocked) on each pull request, so a broken change can't be merged.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Run page tests
        run: python tests/run_all.py -j 4
      - name: Keep screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-screenshots
          path: tests/out/
          retention-days: 7
