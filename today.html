<script>
/* ===================== shared helpers (same storage as the Weapons page) ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function setStatus(msg, err){ const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; }
function toast(msg){
  let t = document.querySelector('.toast');
  if (!t){ t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2500);
}
async function copyText(text, msg){ try { await navigator.clipboard.writeText(text); toast(msg || 'Copied'); } catch { prompt('Copy this:', text); } }

function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('d2rollcheck', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function cacheGet(k){ try { const db = await idb(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch { return undefined; } }
async function cacheSet(k, v){ try { const db = await idb(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch {} }

async function net(url, what, opts){
  try { return await fetch(url, opts); }
  catch (e){ console.error('Fetch failed for', what, url, e); throw new Error('Could not download ' + what + '.\nURL: ' + url + '\nUsually an ad blocker, browser shield or firewall. Press F12, Console tab, for the exact reason.'); }
}
const auth = {
  get(){ try { return JSON.parse(ls.get('auth') || 'null'); } catch { return null; } },
  set(v){ ls.set('auth', v ? JSON.stringify(v) : ''); },
  valid(){ const a = this.get(); return !!(a && a.token && a.exp > Date.now() + 60e3); }
};
function updateAuthUi(){
  const ok = auth.valid(), a = auth.get();
  $('btnAuth').textContent = ok ? 'Sign out' : 'Sign in with Bungie';
  $('authStatus').textContent = ok ? 'Signed in until ' + new Date(a.exp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  $('charSel').classList.toggle('hidden', !ok || !state.chars.length);
  document.body.classList.toggle('authed', ok);
  // sign-in lasts about an hour: warn 5 minutes before, and say clearly when it has run out
  const b = $('authBanner');
  if (b){
    const left = a && a.token ? a.exp - Date.now() : null;
    if (a && a.token && !ok){
      b.className = 'authbanner'; $('authBannerText').textContent = 'Your Bungie sign-in expired (it lasts about an hour), so Pull, Lock and Apply are hidden.';
      $('authBannerBtn').textContent = 'Sign in again';
    } else if (ok && left < 5 * 60e3){
      b.className = 'authbanner soon'; $('authBannerText').textContent = 'Bungie sign-in ends in ' + Math.max(1, Math.round(left / 60e3)) + ' min. Sign in again now to keep Pull and Lock working.';
      $('authBannerBtn').textContent = 'Renew sign-in';
    } else b.className = 'authbanner hidden';
  }
}
$('authBannerBtn').onclick = () => { if (auth.valid()) auth.set(Object.assign(auth.get(), { exp: 0 })); $('btnAuth').click(); };
setInterval(() => { const was = document.body.classList.contains('authed'); updateAuthUi(); if (was !== auth.valid() && state.items.length) render(); }, 20e3);
$('btnAuth').onclick = () => {
  if (auth.valid()){ auth.set(null); updateAuthUi(); setStatus('Signed out.'); return; }
  const cid = ls.get('clientId');
  if (!cid || !ls.get('apiKey')){ setStatus('Add your API key and OAuth client_id in Settings on the Weapons page first.', true); return; }
  if (location.protocol !== 'https:'){ setStatus('Bungie sign-in needs https. Start the app with start-server-https.ps1 and open https://localhost:8443/today.html', true); return; }
  const st = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { sessionStorage.setItem('oauthState', st); sessionStorage.setItem('returnTo', 'today.html'); } catch {}
  location.href = 'https://www.bungie.net/en/OAuth/Authorize?client_id=' + encodeURIComponent(cid) + '&response_type=code&state=' + st;
};
async function bungie(path, body, plainBody){
  const key = ls.get('apiKey');
  if (!key) throw new Error('Add your Bungie API key in Settings on the Weapons page first.');
  const headers = { 'X-API-Key': key };
  if (body && !plainBody) headers['Content-Type'] = 'application/json';
  if (auth.valid()) headers.Authorization = 'Bearer ' + auth.get().token;
  const r = await net('https://www.bungie.net/Platform' + path, 'Bungie API (' + path.split('/').slice(0, 3).join('/') + ')', { method: body ? 'POST' : 'GET', headers, cache: 'no-store', body: body ? JSON.stringify(body) : undefined });
  let j; try { j = await r.json(); } catch { throw new Error('Bungie API returned HTTP ' + r.status + '. Check that your API key Origin Header matches ' + location.origin); }
  if (j.ErrorCode !== 1) throw new Error(j.Message || j.ErrorStatus || 'Bungie API error');
  return j.Response;
}
async function bungieAction(path, body){
  if (!auth.valid()) throw new Error('Sign in with Bungie first (top right).');
  try { return await bungie(path, body); } catch (e){ if (/Could not download/.test(e.message)) return await bungie(path, body, true); throw e; }
}
const entMem = new Map();
async function ent(type, hash){
  const k = type + ':' + hash;
  if (entMem.has(k)) return entMem.get(k);
  const p = (async () => {
    const c = await cacheGet('ent:' + k);
    if (c && c.v === state.manVer) return c.d;
    let d, lastErr;
    for (const wait of [0, 1500, 4000]){
      if (wait) await sleep(wait);
      try { d = await bungie('/Destiny2/Manifest/' + type + '/' + hash + '/'); lastErr = null; break; }
      catch (e){ lastErr = e; if (!/origin|throttl|busy|unavailable|try again|Could not download/i.test(e.message)) break; }
    }
    if (lastErr) throw lastErr;
    await cacheSet('ent:' + k, { v: state.manVer, d });
    return d;
  })();
  entMem.set(k, p);
  try { return await p; } catch (e){ entMem.delete(k); throw e; }
}
async function entMany(type, hashes){
  const out = {}, list = [...new Set(hashes.filter(Boolean))];
  for (let i = 0; i < list.length; i += 8) await Promise.all(list.slice(i, i + 8).map(async h => { try { out[h] = await ent(type, h); } catch (e){ console.warn(type, h, e.message); } }));
  return out;
}



/* ===================== item names (shared manifest cache with Armor and Vendors) ===================== */
const CLASS = ['Titan', 'Hunter', 'Warlock'];
const SLOT = { 3448274439: 'Helmet', 3551918588: 'Arms', 14239492: 'Chest', 20886954: 'Legs', 1585787867: 'Class item' };
async function loadDefs(){
  if (state.defs) return;
  setStatus('Checking Bungie manifest version...');
  const man = await bungie('/Destiny2/Manifest/');
  state.manVer = man.version; updateFooter();
  const cached = await cacheGet('manifestArmor');   // same cache as the Armor page
  if (cached && cached.version === man.version){ state.defs = cached.data; state.sets = cached.sets || {}; return; }
  const paths = man.jsonWorldComponentContentPaths.en;
  setStatus('Downloading item definitions (first run only, about 30 to 60 MB)...');
  const r = await net('https://www.bungie.net' + paths.DestinyInventoryItemLiteDefinition, 'the Bungie item definitions file');
  const raw = await r.json(), data = {};
  for (const h in raw){
    const d = raw[h], dp = d.displayProperties || {}, inv = d.inventory || {};
    data[h] = { n: dp.name || '', i: dp.icon || '', t: d.itemTypeDisplayName || '', it: d.itemType, tier: inv.tierType || 0, b: inv.bucketTypeHash || 0, c: d.classType };
  }
  const sets = {};
  if (paths.DestinyEquipableItemSetDefinition){
    try {
      const sr = await net('https://www.bungie.net' + paths.DestinyEquipableItemSetDefinition, 'armor set definitions');
      const sraw = await sr.json();
      for (const h in sraw){ const sd = sraw[h]; for (const ih of (sd.setItems || [])) sets[ih] = (sd.displayProperties || {}).name || ''; }
    } catch (e){ console.warn('Set definitions unavailable', e.message); }
  }
  await cacheSet('manifestArmor', { version: man.version, data, sets });
  state.defs = data; state.sets = sets;
}



/* ===================== activity definitions ===================== */
// Trimmed copies of the activity, modifier, mode, milestone, destination and place tables, cached per manifest version
const ACT_TABLES = ['DestinyActivityDefinition', 'DestinyActivityModifierDefinition', 'DestinyActivityModeDefinition', 'DestinyMilestoneDefinition', 'DestinyDestinationDefinition', 'DestinyPlaceDefinition'];
const T = { act: {}, mod: {}, mode: {}, ms: {}, dest: {}, place: {} };
async function loadActDefs(){
  if (state.actVer && state.actVer === state.manVer) return;
  const cached = await cacheGet('manifestToday');
  if (cached && cached.version === state.manVer){ Object.assign(T, cached.data); state.actVer = state.manVer; return; }
  const man = await bungie('/Destiny2/Manifest/');
  const paths = man.jsonWorldComponentContentPaths.en;
  const dp = d => d.displayProperties || {};
  for (let k = 0; k < ACT_TABLES.length; k++){
    const name = ACT_TABLES[k];
    setStatus('Downloading activity definitions (first run only) ' + (k + 1) + ' of ' + ACT_TABLES.length + ': ' + name.replace(/^Destiny|Definition$/g, '') + '...');
    if (!paths[name]) continue;
    const raw = await (await net('https://www.bungie.net' + paths[name], 'Bungie ' + name)).json();
    for (const h in raw){
      const d = raw[h], p = dp(d);
      if (name === 'DestinyActivityDefinition'){
        const o = d.originalDisplayProperties || {};
        T.act[h] = { n: p.name || '', d: p.description || '', i: p.icon || '', o: o.name || '', img: d.pgcrImage || '', dest: d.destinationHash || 0,
          mode: d.directActivityModeHash || 0, pvp: !!d.isPvP, light: d.activityLightLevel || 0, pl: !!d.isPlaylist };
      } else if (name === 'DestinyActivityModifierDefinition'){
        if (p.name) T.mod[h] = { n: p.name, d: p.description || '', i: p.icon || '', s: d.displayInActivitySelection !== false };
      } else if (name === 'DestinyActivityModeDefinition'){
        T.mode[h] = { n: p.name || '', i: p.icon || '' };
      } else if (name === 'DestinyMilestoneDefinition'){
        T.ms[h] = { n: p.name || d.friendlyName || '', d: p.description || '', i: p.icon || '', img: d.image || '', ex: !!d.showInExplorer };
      } else if (name === 'DestinyDestinationDefinition'){
        T.dest[h] = { n: p.name || '', pl: d.placeHash || 0 };
      } else {
        T.place[h] = { n: p.name || '' };
      }
    }
    await sleep(0);
  }
  await cacheSet('manifestToday', { version: state.manVer, data: T });
  state.actVer = state.manVer;
}

/* ===================== state ===================== */
const state = { defs: null, sets: {}, manVer: '', actVer: '', chars: [], acct: null, items: [], pub: null, pubAt: 0, char: {}, tchar: null, objs: {} };
const nameOf = h => (state.defs && state.defs[h] && state.defs[h].n) || '';
const PM_BUCKET = 215593132;

/* ---- account, characters, inventory (for the Activity stream) ---- */
const selChar = () => {
  if (!state.chars || !state.chars.length) return null;
  const v = $('charSel').value;
  return (v && v !== 'auto' && state.chars.some(c => c.id === v)) ? v : (state.activeChar || state.chars[0].id);
};
function fillCharSel(p){
  const acts = (p.characterActivities && p.characterActivities.data) || {};
  const live = state.chars.find(c => acts[c.id] && acts[c.id].currentActivityHash);
  state.activeChar = (live || state.chars[0] || {}).id;
  const a = state.chars.find(c => c.id === state.activeChar);
  const saved = ls.get('pullChar2') || 'auto';
  $('charSel').innerHTML = '<option value="auto">Pull to: Auto (' + esc(a ? a.name : '?') + (live ? ', playing now' : ', last played') + ')</option>' +
    state.chars.map(c => '<option value="' + esc(c.id) + '">Pull to: ' + esc(c.name) + (c.light ? ' ' + c.light : '') + '</option>').join('');
  $('charSel').value = (saved !== 'auto' && state.chars.some(c => c.id === saved)) ? saved : 'auto';
}
$('charSel').onchange = () => ls.set('pullChar2', $('charSel').value);
async function setLock(i, v){ await bungieAction('/Destiny2/Actions/Items/SetLockState/', { state: v, itemId: i.id, characterId: i.charId || selChar(), membershipType: state.acct.membershipType }); i.locked = v; }
async function transfer(i, toVault, charId){ await bungieAction('/Destiny2/Actions/Items/TransferItem/', { itemReferenceHash: i.hash, stackSize: 1, transferToVault: toVault, itemId: i.id, characterId: charId, membershipType: state.acct.membershipType }); }
async function pullFromPostmaster(i){
  await bungieAction('/Destiny2/Actions/Items/PullFromPostmaster/', { itemReferenceHash: i.hash, stackSize: 1, itemId: i.id, characterId: i.charId, membershipType: state.acct.membershipType });
  i.postmaster = false; i.loc = (state.chars.find(c => c.id === i.charId) || {}).name || 'Character';
}
async function pullTo(i, target){
  if (i.postmaster){ await pullFromPostmaster(i); await sleep(300); }
  if (i.charId === target) return;
  if (i.equipped) throw new Error(i.name + ' is equipped. Unequip it in game first.');
  if (i.charId){ await transfer(i, true, i.charId); i.charId = null; i.loc = 'Vault'; await sleep(300); }
  await transfer(i, false, target); i.charId = target; i.loc = (state.chars.find(c => c.id === target) || {}).name || 'Character';
}
function isGoneError(e){ return /item requested was not found|DestinyItemNotFound|item not found/i.test((e && e.message) || ''); }

async function getAccount(){
  if (state.acct) return state.acct;
  const me = await bungie('/User/GetMembershipsForCurrentUser/');
  const ms = me.destinyMemberships || [];
  const a = ms.find(x => x.membershipId === me.primaryMembershipId) || ms.find(x => x.crossSaveOverride && x.membershipType === x.crossSaveOverride) || ms[0];
  if (!a) throw new Error('No Destiny account found on your signed-in Bungie account.');
  state.acct = { membershipType: a.membershipType, membershipId: a.membershipId };
  return state.acct;
}



/* ===================== load ===================== */
$('btnScan').onclick = () => scan({ force: true });
async function scan(opts = {}){
  if (state.scanning) return;
  state.scanning = true; $('btnScan').disabled = true;
  const prevStatus = $('status').textContent;
  try {
    await loadDefs();
    await loadActDefs();
    // weekly rotations are public: no sign-in needed
    if (opts.force || !state.pub || Date.now() >= state.pubDue){
      if (!opts.silent) setStatus('Reading this week\'s rotations...');
      state.pub = await bungie('/Destiny2/Milestones/');
      state.pubAt = Date.now(); state.pubDue = nextReset();
      await loadObjectives(Object.values(state.pub).flatMap(m => (m.activities || []).flatMap(a => a.challengeObjectiveHashes || [])));
    }
    if (auth.valid()){
      const acct = await getAccount();
      if (!opts.silent) setStatus('Reading what your characters can play...');
      const p = await bungie('/Destiny2/' + acct.membershipType + '/Profile/' + acct.membershipId + '/?components=102,200,201,204,205,300');
      const chars = (p.characters && p.characters.data) || {};
      state.chars = Object.values(chars).sort((a, b) => new Date(b.dateLastPlayed) - new Date(a.dateLastPlayed))
        .map(c => ({ id: c.characterId, name: CLASS[c.classType] || 'Character', light: c.light, cls: c.classType }));
      fillCharSel(p); updateAuthUi();
      trackDrops(p);
      const acts = (p.characterActivities && p.characterActivities.data) || {};
      for (const c of state.chars) state.char[c.id] = acts[c.id] || null;
      await loadObjectives(Object.values(state.char).flatMap(c => ((c && c.availableActivities) || []).flatMap(a => (a.challenges || []).map(x => x.objective && x.objective.objectiveHash))));
      if (!state.tchar || !state.chars.some(c => c.id === state.tchar)) state.tchar = ls.get('todayChar') && state.chars.some(c => c.id === ls.get('todayChar')) ? ls.get('todayChar') : state.activeChar;
    }
    state.lastScan = Date.now();
    render();
    const nAct = state.nActs || 0;
    setStatus(opts.silent ? prevStatus : (Object.keys(state.pub || {}).length + ' weekly rotations' + (auth.valid() ? ', ' + nAct + ' activities your ' + ((state.chars.find(c => c.id === state.tchar) || {}).name || 'character') + ' can play.' : '. Sign in with Bungie to see what your characters can play, your challenge progress and rewards.')));
    tickRefresh();
  } catch (e){ setStatus(e.message, true); }
  finally { state.scanning = false; $('btnScan').disabled = false; }
}
async function loadObjectives(hashes){
  const need = [...new Set(hashes.filter(h => h && !(h in state.objs)))];
  if (!need.length) return;
  const d = await entMany('DestinyObjectiveDefinition', need);
  for (const h of need){ const o = d[h] || {}; state.objs[h] = o.progressDescription || (o.displayProperties || {}).name || ''; }
}

/* ===================== time ===================== */
const RESET_H = 17;   // daily and weekly reset: 17:00 UTC
function nextUtc(dow){
  const n = new Date(), d = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), RESET_H));
  if (dow == null){ if (d <= n) d.setUTCDate(d.getUTCDate() + 1); return d.getTime(); }
  let add = (dow - d.getUTCDay() + 7) % 7; if (add === 0 && d <= n) add = 7;
  d.setUTCDate(d.getUTCDate() + add); return d.getTime();
}
const nextReset = () => nextUtc(null) + 60e3;
function xurWindow(){
  const fri = nextUtc(5), lastFri = fri - 7 * 864e5, now = Date.now();
  const here = now >= lastFri && now < lastFri + 4 * 864e5;
  return { here, arrives: here ? lastFri : fri, leaves: (here ? lastFri : fri) + 4 * 864e5 };
}
const fmtWhen = t => new Date(t).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
function left(t){
  let s = Math.max(0, Math.round((t - Date.now()) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60;
  return d ? d + 'd ' + h + 'h ' + m + 'm' : h ? h + 'h ' + m + 'm' : m + 'm ' + s + 's';
}
const cd = t => '<span data-cd="' + t + '">' + left(t) + '</span>';
const endsTxt = iso => { const t = Date.parse(iso || ''); return t && t > Date.now() && t < Date.now() + 120 * 864e5 ? '<div class="ends">Ends ' + fmtWhen(t) + ' (in ' + cd(t) + ')</div>' : ''; };

/* ===================== render ===================== */
const img = p => p ? 'https://www.bungie.net' + esc(p) : '';
function actName(h){ const a = T.act[h] || {}; return a.o || a.n || ''; }
function actType(h){
  const a = T.act[h] || {}, n = a.o || a.n || '';
  if (/:/.test(n)) return n.split(':')[0].trim();
  return (T.mode[a.mode] || {}).n || (a.pvp ? 'Crucible' : 'Other');
}
function where(h){ const a = T.act[h] || {}, d = T.dest[a.dest]; if (!d || !d.n) return ''; const p = T.place[d.pl]; return d.n + (p && p.n && p.n !== d.n ? ', ' + p.n : ''); }
function modsHtml(hashes){
  const ms = (hashes || []).map(h => T.mod[h]).filter(m => m && m.s && m.n);
  const seen = new Set(), uniq = ms.filter(m => !seen.has(m.n) && seen.add(m.n));
  return uniq.length ? '<div class="mods">' + uniq.map(m => '<span class="mod" title="' + esc(m.d) + '">' + (m.i ? '<img src="' + img(m.i) + '" alt="">' : '') + esc(m.n) + '</span>').join('') + '</div>' : '';
}
function rewardsHtml(vr){
  const items = (vr || []).flatMap(r => r.rewardItems || []).map(x => x.itemQuantity || {}).filter(q => q.itemHash && nameOf(q.itemHash));
  if (!items.length) return '';
  const seen = new Set(), uniq = items.filter(q => !seen.has(q.itemHash) && seen.add(q.itemHash));
  return '<details class="ax"><summary>Rewards (' + uniq.length + ')</summary><div class="rw">' + uniq.map(q => {
    const d = state.defs[q.itemHash] || {};
    return '<span class="rwi">' + (d.i ? '<img src="' + img(d.i) + '" alt="">' : '') + esc(d.n) + (q.quantity > 1 ? ' ×' + q.quantity : '') + '</span>';
  }).join('') + '</div></details>';
}
function chalHtml(list){
  if (!list || !list.length) return '';
  return '<details class="ax" open><summary>Challenges</summary>' + list.map(c => {
    const o = c.objective || c, txt = state.objs[o.objectiveHash] || 'Challenge';
    const prog = o.completionValue ? (o.progress || 0) + ' / ' + o.completionValue : '';
    return '<div class="chal' + (o.complete ? ' ok' : '') + '"><span>' + (o.complete ? '✓ ' : '') + esc(txt) + '</span><span>' + prog + '</span></div>';
  }).join('') + '</details>';
}
function actCard(h, extra = {}){
  const a = T.act[h] || {};
  const name = extra.title || actName(h) || 'Activity', type = extra.type || actType(h);
  const loc = where(h);
  return '<div class="act' + (extra.done ? ' done' : '') + '"><div class="hero" style="background-image:url(\'' + img(extra.image || a.img) + '\')"><span class="ty">' + esc(type) + '</span>' + (extra.feat ? '<span class="feat">Featured</span>' : '') + '</div>' +
    '<div class="ab"><div class="an">' + (a.i ? '<img src="' + img(a.i) + '" alt="">' : '') + esc(name) + '</div>' +
    (extra.sub ? '<div class="meta">' + esc(extra.sub) + '</div>' : '') +
    ((extra.desc || a.d) ? '<div class="ad">' + esc(extra.desc || a.d) + '</div>' : '') +
    '<div class="meta">' + [loc ? '📍 ' + esc(loc) : '', (extra.light || a.light) ? 'Power ' + (extra.light || a.light) : ''].filter(Boolean).join(' · ') + '</div>' +
    (extra.ends || '') + modsHtml(extra.mods) + chalHtml(extra.chal) + rewardsHtml(extra.rewards) + '</div></div>';
}
const q = () => $('tSearch').value.trim().toLowerCase();
function matches(h, extra = []){
  const s = q(); if (!s) return true;
  const a = T.act[h] || {};
  return [a.n, a.o, a.d, actType(h), where(h), ...extra].join(' ').toLowerCase().includes(s);
}
const modNames = hs => (hs || []).map(h => (T.mod[h] || {}).n || '');
const rewardNames = vr => (vr || []).flatMap(r => r.rewardItems || []).map(x => nameOf((x.itemQuantity || {}).itemHash));

/* ---- lost sector of the day ----
   Bungie doesn't publish this rotation as a milestone. The day's lost sector is the one your character can run at
   Expert/Master/Legend difficulty (the others only have the normal version), usually with champion modifiers. */
const LS_DIFF = /\b(grandmaster|master|legend|expert|advanced)\b/i;
const DIFF_RANK = { advanced: 1, expert: 2, legend: 3, master: 4, grandmaster: 5 };
const isLostSector = h => { const a = T.act[h] || {}; return /lost sector/i.test([a.n, a.o, (T.mode[a.mode] || {}).n].join(' ')); };
const lsBase = h => { const a = T.act[h] || {}; return (a.o || a.n || '').replace(/^lost sector\s*:\s*/i, '').replace(/\s*[(:\-–]\s*(grandmaster|master|legend|expert|advanced|normal)\)?\s*$/i, '').replace(/\s*\((grandmaster|master|legend|expert|advanced|normal)\)/i, '').trim(); };
const isChampMod = h => /champion|overload|unstoppable|barrier/i.test(((T.mod[h] || {}).n || '') + ' ' + ((T.mod[h] || {}).d || ''));
function findLostSectors(c){
  const ls = ((c && c.availableActivities) || []).filter(a => a.isVisible !== false && isLostSector(a.activityHash));
  const daily = ls.filter(a => { const a2 = T.act[a.activityHash] || {}; return LS_DIFF.test((a2.o || '') + ' ' + (a2.n || '')) || a.isFocusedActivity || (a.modifierHashes || []).some(isChampMod); });
  const groups = new Map();
  for (const a of daily){
    const base = lsBase(a.activityHash) || actName(a.activityHash);
    const g = groups.get(base) || { name: base, hash: a.activityHash, diffs: [], mods: [], rewards: [], feat: false };
    const a2 = T.act[a.activityHash] || {}, m = ((a2.o || '') + ' ' + (a2.n || '')).match(LS_DIFF);
    g.diffs.push({ label: m ? m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() : 'Normal', light: a.recommendedLight || a2.light || 0 });
    g.mods.push(...(a.modifierHashes || []));
    for (const r of a.visibleRewards || []) for (const x of r.rewardItems || []) if (x.itemQuantity && x.itemQuantity.itemHash) g.rewards.push(x.itemQuantity.itemHash);
    g.feat = g.feat || !!a.isFocusedActivity;
    if (m) g.hash = a.activityHash;
    groups.set(base, g);
  }
  const out = [...groups.values()];
  out.forEach(g => { g.diffs.sort((x, y) => (DIFF_RANK[x.label.toLowerCase()] || 0) - (DIFF_RANK[y.label.toLowerCase()] || 0)); g.mods = [...new Set(g.mods)]; g.rewards = [...new Set(g.rewards)]; });
  return out;
}
// remember today's lost sector so it still shows when you're signed out later the same day
const lastReset = () => nextUtc(null) - 864e5;
function lsCache(list){
  if (list){ ls.set('lsToday', JSON.stringify({ day: lastReset(), list })); return list; }
  try { const c = JSON.parse(ls.get('lsToday') || 'null'); return c && c.day === lastReset() ? c.list : null; } catch { return null; }
}
function renderLost(){
  const el = $('lost');
  const c = state.tchar && state.char[state.tchar];
  let list = c ? lsCache(findLostSectors(c).map(g => ({ name: g.name, hash: g.hash, diffs: g.diffs, mods: g.mods, rewards: g.rewards }))) : lsCache();
  const fromCache = !c && list;
  const head = '<div class="sect"><h2>Lost Sector today</h2><span class="dim-lbl">Changes at the daily reset, in ' + cd(nextUtc(null)) + '.' + (fromCache ? ' Seen on your account earlier today.' : '') + '</span></div>';
  if (!list){
    el.innerHTML = head + '<div class="panel signin">' + (auth.valid() ? 'Loading…' : 'Sign in with Bungie (top right) to see today\'s lost sector. Bungie only lists the daily rotation in your character\'s activities, not in the public data.') + '</div>';
    return;
  }
  if (!list.length){ el.innerHTML = head + '<div class="panel dim-lbl">Bungie isn\'t listing a rotating lost sector for this character right now. If you haven\'t unlocked Expert or Master lost sectors on this character yet, try another one.</div>'; return; }
  const s = q();
  list = list.filter(g => !s || [g.name, where(g.hash), ...modNames(g.mods), ...g.rewards.map(nameOf)].join(' ').toLowerCase().includes(s));
  el.innerHTML = head + list.map(g => {
    const a = T.act[g.hash] || {}, loc = where(g.hash);
    const rw = g.rewards.map(h => (state.defs || {})[h]).filter(d => d && d.n);
    return '<div class="lsbox"><div class="hero" style="background-image:url(\'' + img(a.img) + '\')"></div><div class="ab">' +
      '<h3>' + esc(g.name) + '</h3>' + (loc ? '<div class="vloc" style="color:#9fe7ff">📍 ' + esc(loc) + '</div>' : '') +
      '<div class="diffs">' + g.diffs.map(d => '<span class="diff"><b>' + esc(d.label) + '</b>' + (d.light ? ' · Power ' + d.light : '') + '</span>').join('') + '</div>' +
      modsHtml(g.mods) +
      (rw.length ? '<div class="lsrw">' + rw.map(d => '<span class="rwi">' + (d.i ? '<img src="' + img(d.i) + '" alt="">' : '') + esc(d.n) + '</span>').join('') + '</div>' : '') +
      ((a.d) ? '<div class="ad">' + esc(a.d) + '</div>' : '') + '</div></div>';
  }).join('');
}

function render(){
  const daily = nextUtc(null), weekly = nextUtc(2), xw = xurWindow();
  $('topinfo').innerHTML =
    '<div class="sum"><span class="dim-lbl">Daily reset</span><b>' + cd(daily) + '</b><span class="dim-lbl">' + fmtWhen(daily) + ' your time</span></div>' +
    '<div class="sum"><span class="dim-lbl">Weekly reset</span><b>' + cd(weekly) + '</b><span class="dim-lbl">' + fmtWhen(weekly) + ' your time</span></div>' +
    (() => { const c = state.tchar && state.char[state.tchar]; const l = c ? findLostSectors(c) : (lsCache() || []); return l.length ? '<div class="sum"><span class="dim-lbl">Lost Sector today</span><b style="font-size:16px">' + esc(l.map(g => g.name).join(' / ')) + '</b><span class="dim-lbl">' + esc(where(l[0].hash)) + '</span></div>' : ''; })() +
    '<div class="sum"><span class="dim-lbl">' + (xw.here ? 'Xûr leaves in' : 'Xûr arrives in') + '</span><b>' + cd(xw.here ? xw.leaves : xw.arrives) + '</b><span class="dim-lbl"><a href="vendors.html">Vendors &amp; Xûr →</a></span></div>';
  renderLost(); renderWeekly(); renderChar();
}
function renderWeekly(){
  const el = $('weekly');
  if (!state.pub){ el.innerHTML = ''; return; }
  const ms = Object.values(state.pub).sort((a, b) => (a.order || 0) - (b.order || 0));
  const cards = [];
  for (const m of ms){
    const md = T.ms[m.milestoneHash] || {};
    const acts = m.activities || [];
    if (!acts.length && !md.n) continue;
    if (!acts.length){
      if (!matches(0, [md.n, md.d])) continue;
      cards.push('<div class="act"><div class="hero" style="background-image:url(\'' + img(md.img) + '\')"><span class="ty">Weekly</span></div><div class="ab"><div class="an">' + (md.i ? '<img src="' + img(md.i) + '" alt="">' : '') + esc(md.n || 'Milestone') + '</div>' +
        (md.d ? '<div class="ad">' + esc(md.d) + '</div>' : '') + endsTxt(m.endDate) + '</div></div>');
      continue;
    }
    // one card per milestone: its first activity, with the modifiers and challenges they share
    const a0 = acts[0];
    if (!matches(a0.activityHash, [md.n, md.d, ...acts.flatMap(a => modNames(a.modifierHashes))])) continue;
    const variants = [...new Set(acts.map(a => actName(a.activityHash)).filter(Boolean))];
    cards.push(actCard(a0.activityHash, {
      title: md.n || actName(a0.activityHash), type: 'This week', image: (T.act[a0.activityHash] || {}).img || md.img,
      desc: md.d || undefined, sub: variants.length > 1 ? variants.slice(0, 6).join(' · ') + (variants.length > 6 ? ' …' : '') : (variants[0] && variants[0] !== md.n ? variants[0] : ''),
      ends: endsTxt(m.endDate), mods: acts.flatMap(a => a.modifierHashes || []),
      chal: [...new Set(acts.flatMap(a => a.challengeObjectiveHashes || []))].map(h => ({ objectiveHash: h }))
    }));
  }
  el.innerHTML = '<div class="sect"><h2>This week</h2><span class="dim-lbl">Weekly rotations from Bungie, the same for everyone. They change at the weekly reset.</span></div>' +
    (cards.length ? '<div class="agrid">' + cards.join('') + '</div>' : '<div class="panel dim-lbl">Nothing matches the search.</div>');
}
function renderChar(){
  const c = state.tchar && state.char[state.tchar];
  if (!auth.valid() || !c){
    $('toolbar').classList.toggle('hidden', !state.pub);
    $('tChar').innerHTML = '<span class="dim-lbl">Sign in with Bungie to pick a character.</span>';
    $('featured').innerHTML = state.pub && !auth.valid() ? '<div class="panel signin" style="margin-top:18px">Sign in with Bungie (top right) to add what your characters can play right now: featured activities, weekly challenges with your progress, modifiers and rewards.</div>' : '';
    $('challenges').innerHTML = ''; $('allActs').innerHTML = '';
    return;
  }
  $('toolbar').classList.remove('hidden');
  $('tChar').innerHTML = state.chars.map(ch => '<span class="chip ' + (ch.id === state.tchar ? 'on' : '') + '" data-c="' + ch.id + '">' + esc(ch.name) + (ch.light ? ' <b>' + ch.light + '</b>' : '') + '</span>').join('');
  $('tChar').querySelectorAll('.chip').forEach(x => x.onclick = () => { state.tchar = x.dataset.c; ls.set('todayChar', state.tchar); renderLost(); renderChar(); });
  const list = (c.availableActivities || []).filter(a => a.isVisible !== false && actName(a.activityHash));
  // same name, several difficulty variants: keep one card (the featured or highest-power one)
  const byName = new Map();
  for (const a of list){
    const n = actName(a.activityHash), cur = byName.get(n);
    if (!cur || (a.isFocusedActivity && !cur.isFocusedActivity) || ((a.challenges || []).length > (cur.challenges || []).length) || (!cur.isFocusedActivity && (a.recommendedLight || 0) > (cur.recommendedLight || 0))) byName.set(n, a);
  }
  const acts = [...byName.values()];
  state.nActs = acts.length;
  const extra = a => ({ feat: a.isFocusedActivity, light: a.recommendedLight, mods: a.modifierHashes, chal: a.challenges, rewards: a.visibleRewards,
    done: a.isCompleted && !(a.challenges || []).some(x => x.objective && !x.objective.complete) });
  const ok = a => matches(a.activityHash, [...modNames(a.modifierHashes), ...rewardNames(a.visibleRewards)]);
  const feat = acts.filter(a => a.isFocusedActivity && ok(a));
  $('featured').innerHTML = '<div class="sect"><h2>Featured right now</h2><span class="dim-lbl">What the Portal is spotlighting for your ' + esc((state.chars.find(x => x.id === state.tchar) || {}).name || '') + '.</span></div>' +
    (feat.length ? '<div class="agrid">' + feat.map(a => actCard(a.activityHash, extra(a))).join('') + '</div>' : '<div class="panel dim-lbl">' + (q() ? 'Nothing featured matches the search.' : 'Bungie isn\'t flagging any featured activities for this character.') + '</div>');
  const ch = acts.filter(a => (a.challenges || []).length && !a.isFocusedActivity && ok(a))
    .sort((x, y) => (x.challenges.every(c => c.objective && c.objective.complete) ? 1 : 0) - (y.challenges.every(c => c.objective && c.objective.complete) ? 1 : 0));
  $('challenges').innerHTML = ch.length ? '<div class="sect"><h2>Weekly challenges</h2><span class="dim-lbl">Activities with challenges this week, with your progress. Finished ones are faded and sorted last.</span></div><div class="agrid">' + ch.map(a => actCard(a.activityHash, extra(a))).join('') + '</div>' : '';
  const groups = {};
  for (const a of acts){ if (!ok(a)) continue; (groups[actType(a.activityHash)] = groups[actType(a.activityHash)] || []).push(a); }
  const keys = Object.keys(groups).sort((x, y) => groups[y].length - groups[x].length || x.localeCompare(y));
  const open = new Set(JSON.parse(ls.get('todayOpen') || '[]'));
  $('allActs').innerHTML = '<div class="sect"><h2>Everything you can play</h2><span class="dim-lbl">' + acts.length + ' activities, grouped by type. Click a group to open it.</span></div><div class="modelist">' +
    keys.map(k => '<details data-k="' + esc(k) + '"' + (open.has(k) || q() ? ' open' : '') + '><summary>' + esc(k) + '<b>' + groups[k].length + '</b></summary><div class="agrid">' +
      groups[k].sort((x, y) => actName(x.activityHash).localeCompare(actName(y.activityHash))).map(a => actCard(a.activityHash, extra(a))).join('') + '</div></details>').join('') + '</div>';
  $('allActs').querySelectorAll('details[data-k]').forEach(d => d.ontoggle = () => {
    if (q()) return;
    const s = new Set(JSON.parse(ls.get('todayOpen') || '[]')); d.open ? s.add(d.dataset.k) : s.delete(d.dataset.k); ls.set('todayOpen', JSON.stringify([...s]));
  });
}
let searchT = 0;
$('tSearch').oninput = () => { clearTimeout(searchT); searchT = setTimeout(() => { renderLost(); renderWeekly(); renderChar(); }, 150); };

/* ===================== footer, refresh, countdowns ===================== */
function updateFooter(){
  $('sitefoot').innerHTML = ['<b>Rotations:</b> Bungie.net API (public milestones) · <b>Your activities:</b> Bungie.net API (character activities, signed in)',
    '<b>Names, images, modifiers:</b> Bungie manifest ' + (state.manVer ? '<code>' + esc(state.manVer) + '</code>' : '(loads on first visit)'),
    'Not affiliated with Bungie'].join('<br>');
}
$('autoRefresh').checked = ls.get('autoRefresh') !== '0';
$('autoRefresh').onchange = () => { ls.set('autoRefresh', $('autoRefresh').checked ? '1' : '0'); tickRefresh(); };
const REFRESH_SECS = 60;
function autoRefreshOk(minAge){ return $('autoRefresh').checked && state.acct && auth.valid() && !state.scanning && !document.hidden && Date.now() - (state.lastScan || 0) > minAge; }
window.addEventListener('focus', () => { if (autoRefreshOk(15e3)) scan({ silent: true }); });
function tickRefresh(){
  document.querySelectorAll('[data-cd]').forEach(e => e.textContent = left(+e.dataset.cd));
  if (state.pub && Date.now() >= state.pubDue && !state.scanning){ scan({ silent: true }); return; }   // reset passed: reload rotations
  const el = $('lastScan'); if (!el || !state.lastScan) return;
  const fmt = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  const base = 'Rotations ' + fmt(state.pubAt) + (state.acct ? ' · your activities ' + fmt(state.lastScan) : '');
  if (!state.acct || !$('autoRefresh').checked){ el.textContent = base + (state.acct ? ' · auto-refresh off' : ''); return; }
  if (state.scanning){ el.textContent = base + ' · refreshing now'; return; }
  const s = Math.max(0, Math.ceil((state.lastScan + REFRESH_SECS * 1000 - Date.now()) / 1000));
  el.textContent = base + ' · next refresh in ' + s + 's';
  if (s === 0 && autoRefreshOk(REFRESH_SECS * 1000 - 500)) scan({ silent: true });
}
setInterval(tickRefresh, 1000);

/* ===================== activity stream hooks (stream.js) ===================== */
const PAGE = 'today';
const streamInfo = null, streamOpen = null;
const byId = () => null;
const runAction = () => {};

updateFooter();
updateAuthUi();
render();
if (ls.get('apiKey')) scan(); else setStatus('Add your Bungie API key in Settings (on the Weapons page) first.', true);
</script>
<script src="stream.js"></script>
