$('authBannerBtn').onclick = () => { if (auth.valid()) auth.set(Object.assign(auth.get(), { exp: 0 })); $('btnAuth').click(); };

/* ===================== item names (shared manifest cache with Armor and Vendors) ===================== */

async function loadDefs(){
  if (state.defs) return;
  setStatus('Checking Bungie manifest version...');
  const man = await bungie('/Destiny2/Manifest/');
  state.manVer = man.version; updateFooter();
  const cached = await cacheGet('manifestArmor');   // same cache as the Armor page
  if (cached && cached.version === man.version){ state.defs = cached.data; state.sets = cached.sets || {}; return; }
  const paths = man.jsonWorldComponentContentPaths.en;
  setStatus('Downloading item definitions (first run only, about 30 to 60 MB)...');
  const r = await net('https://www.bungie.net' + paths.DestinyInventoryItemLiteDefinition, 'the Bungie item definitions file');
  const raw = await r.json(), data = {};
  for (const h in raw){
    const d = raw[h], dp = d.displayProperties || {}, inv = d.inventory || {};

/* ===================== activity definitions ===================== */
// Trimmed copies of the activity, modifier, mode, milestone, destination and place tables, cached per manifest version
const ACT_TABLES = ['DestinyActivityDefinition', 'DestinyActivityModifierDefinition', 'DestinyActivityModeDefinition', 'DestinyMilestoneDefinition', 'DestinyDestinationDefinition', 'DestinyPlaceDefinition', 'DestinyActivityTypeDefinition'];
const T = { act: {}, mod: {}, mode: {}, ms: {}, dest: {}, place: {}, atype: {}, schema: 2 };   // bump schema when the cached shape changes
async function loadActDefs(){

/* setLock: core.js */
/* transfer: core.js */

/* pullTo: core.js */

const RESET_H = 17;   // daily and weekly reset: 17:00 UTC
function nextUtc(dow){

  if (/:/.test(n)) return n.split(':')[0].trim();
  return (T.mode[a.mode] || {}).n || (a.pvp ? 'Crucible' : 'Other');
}
function where(h){ const a = T.act[h] || {}, d = T.dest[a.dest]; if (!d || !d.n) return ''; const p = T.place[d.pl]; return d.n + (p && p.n && p.n !== d.n ? ', ' + p.n : ''); }
function modsHtml(hashes){
  const ms = (hashes || []).map(h => T.mod[h]).filter(m => m && m.s && m.n);
  const seen = new Set(), uniq = ms.filter(m => !seen.has(m.n) && seen.add(m.n));
  return uniq.length ? '<div class="mods">' + uniq.map(m => '<span class="mod" title="' + esc(m.d) + '">' + (m.i ? '<img decoding="async" src="' + img(m.i) + '" alt="">' : '') + esc(m.n) + '</span>').join('') + '</div>' : '';
}
function rewardsHtml(vr){

  if (!items.length) return '';

  return '<details class="ax"><summary>Rewards (' + uniq.length + ')</summary><div class="rw">' + uniq.map(q => {

  }).join('') + '</div></details>';
}
function chalHtml(list){

    const o = c.objective || c, txt = state.objs[o.objectiveHash] || 'Challenge';

  }).join('') + '</details>';
}
function actCard(h, extra = {}){
  const a = T.act[h] || {};

  const loc = where(h);

    (extra.ends || '') + modsHtml(extra.mods) + chalHtml(extra.chal) + rewardsHtml(extra.rewards) + '</div></div>';

const q = () => $('tSearch').value.trim().toLowerCase();
function matches(h, extra = []){
  const s = q(); if (!s) return true;
  const a = T.act[h] || {};
  return [a.n, a.o, a.d, actType(h), where(h), ...extra].join(' ').toLowerCase().includes(s);
}
const modNames = hs => (hs || []).map(h => (T.mod[h] || {}).n || '');
const rewardNames = vr => (vr || []).flatMap(r => r.rewardItems || []).map(x => nameOf((x.itemQuantity || {}).itemHash));

/* ---- lost sector of the day ----
   Bungie doesn't publish this rotation as a milestone. The day's lost sector is the one your character can run at
   Expert/Master/Legend difficulty (the others only have the normal version), usually with champion modifiers. */
const LS_DIFF = /\b(grandmaster|master|legend|expert|advanced)\b/i;
const DIFF_RANK = { advanced: 1, expert: 2, legend: 3, master: 4, grandmaster: 5 };
// match on activity type, mode, name or description: catches Expert / Master / Legend world lost sectors, not only legacy hashes
const isLostSector = h => { const a = T.act[h] || {}; return /lost sector/i.test([a.n, a.o, a.d, (T.mode[a.mode] || {}).n, (T.atype[a.at] || {}).n].join(' ')); };
const lsBase = h => { const a = T.act[h] || {}; return (a.o || a.n || '').replace(/^lost sector\s*:\s*/i, '').replace(/\s*[(:\-–]\s*(grandmaster|master|legend|expert|advanced|normal)\)?\s*$/i, '').replace(/\s*\((grandmaster|master|legend|expert|advanced|normal)\)/i, '').trim(); };
const isChampMod = h => /champion|overload|unstoppable|barrier/i.test(((T.mod[h] || {}).n || '') + ' ' + ((T.mod[h] || {}).d || ''));
function findLostSectors(c){
  const ls = ((c && c.availableActivities) || []).filter(a => a.isVisible !== false && isLostSector(a.activityHash));
  const daily = ls.filter(a => { const a2 = T.act[a.activityHash] || {}; return LS_DIFF.test((a2.o || '') + ' ' + (a2.n || '')) || a.isFocusedActivity || (a.modifierHashes || []).some(isChampMod); });
  const groups = new Map();
  for (const a of daily){
    const base = lsBase(a.activityHash) || actName(a.activityHash);
    const g = groups.get(base) || { name: base, hash: a.activityHash, diffs: [], mods: [], rewards: [], feat: false };
    const a2 = T.act[a.activityHash] || {}, m = ((a2.o || '') + ' ' + (a2.n || '')).match(LS_DIFF);
    g.diffs.push({ label: m ? m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() : 'Normal', light: a.recommendedLight || a2.light || 0 });
    g.mods.push(...(a.modifierHashes || []));
    for (const r of a.visibleRewards || []) for (const x of r.rewardItems || []) if (x.itemQuantity && x.itemQuantity.itemHash) g.rewards.push(x.itemQuantity.itemHash);
    g.feat = g.feat || !!a.isFocusedActivity;
    if (m) g.hash = a.activityHash;
    groups.set(base, g);
  }
  const out = [...groups.values()];
  out.forEach(g => { g.diffs.sort((x, y) => (DIFF_RANK[x.label.toLowerCase()] || 0) - (DIFF_RANK[y.label.toLowerCase()] || 0)); g.mods = [...new Set(g.mods)]; g.rewards = [...new Set(g.rewards)]; });
  return out;
}
// remember today's lost sector so it still shows when you're signed out later the same day
const lastReset = () => nextUtc(null) - 864e5;
function lsCache(list){
  if (list){ if (list.length) ls.set('lsToday', JSON.stringify({ day: lastReset(), list })); return list; }
  try { const c = JSON.parse(ls.get('lsToday') || 'null'); return c && c.day === lastReset() ? c.list : null; } catch { return null; }
}
const LS_LINKS = '<div class="lslinks">Full daily rotation calendar: <a href="https://kyberscorner.com/destiny2/lost-sectors/" target="_blank" rel="noopener">Kyber\'s Corner ↗</a> · <a href="https://www.todayindestiny.com/" target="_blank" rel="noopener">TodayInDestiny ↗</a></div>';
const slimLS = g => ({ name: g.name, hash: g.hash, diffs: g.diffs, mods: g.mods, rewards: g.rewards });
// today's lost sector from every character you have: the selected one first, then the others; one card per lost sector
function lostFromAccount(){
  const order = [state.tchar, ...(state.chars || []).map(x => x.id).filter(id => id !== state.tchar)].filter(id => id && state.char[id]);
  const seen = new Map();
  for (const id of order) for (const g of findLostSectors(state.char[id])) if (!seen.has(g.name)) seen.set(g.name, { g: slimLS(g), on: id });
  return [...seen.values()];
}

/* ---- daily rotation fallback ----
   One Expert/Master lost sector a day, changing at the daily reset (17:00 UTC). Bungie only lists it in a character's
   activities once that character has cleared it on normal (patrol), so the API can show nothing. Then we project the
   day from a fixed cycle. Cycle and anchor: published 2025 schedules (progametalk July 2025: Jul 1 Thrilladrome ...
   Jul 6 Veles Labyrinth; shacknews: Jul 10 Hydroponics Delta, Jul 11 Gilded Precept) and the d2rotations.report order.
   Not confirmed for Monument of Triumph, so the page re-anchors itself (localStorage lsAnchor) every time Bungie shows
   the real lost sector on any of your characters, or when you pick today's from the list. Champions and shields are the
   last published Legend/Expert values; they can change by season. */
const LS_CYCLE = [
  { n: 'Gilded Precept',      dest: 'Neomuna',        champs: ['Barrier', 'Unstoppable'], shields: ['Void', 'Solar'] },
  { n: 'Thrilladrome',        dest: 'Neomuna',        champs: ['Barrier', 'Overload'],    shields: [] },
  { n: 'The Broken Deep',     dest: 'The Pale Heart', champs: [],                         shields: [] },
  { n: 'The Blooming Deep',   dest: 'The Pale Heart', champs: ['Overload', 'Unstoppable'], shields: [] },
  { n: 'Bunker E15',          dest: 'Europa',         champs: ['Overload', 'Barrier'],    shields: ['Void'] },
  { n: 'Perdition',           dest: 'Europa',         champs: [],                         shields: [] },
  { n: 'Veles Labyrinth',     dest: 'Cosmodrome',     champs: ['Barrier', 'Unstoppable'], shields: ['Arc', 'Solar'] },
  { n: 'Exodus Garden 2A',    dest: 'Cosmodrome',     champs: ['Overload', 'Barrier'],    shields: ['Void'] },
  { n: "Aphelion's Rest",     dest: 'Dreaming City',  champs: ['Overload', 'Unstoppable'], shields: ['Void'] },
  { n: 'Chamber of Starlight', dest: 'Dreaming City', champs: ['Overload', 'Unstoppable'], shields: ['Void', 'Solar'] },
  { n: 'Hydroponics Delta',   dest: 'Neomuna',        champs: ['Barrier', 'Unstoppable'], shields: [] },
];
const LS_DEFAULT_ANCHOR = { day: Date.UTC(2025, 6, 6, RESET_H), name: 'Veles Labyrinth', src: 'schedule' };
const lsKey = n => String(n || '').toLowerCase().replace(/^the\s+/, '').replace(/[^a-z0-9]/g, '');
const lsIdx = n => LS_CYCLE.findIndex(x => lsKey(x.n) === lsKey(n));
function lsAnchor(){ try { const a = JSON.parse(ls.get('lsAnchor') || 'null'); if (a && lsIdx(a.name) >= 0) return a; } catch {} return LS_DEFAULT_ANCHOR; }
function setLsAnchor(name, src){ if (lsIdx(name) < 0) return; const cur = lsAnchor(); if (cur.day === lastReset() && lsKey(cur.name) === lsKey(name) && cur.src === src) return; ls.set('lsAnchor', JSON.stringify({ day: lastReset(), name, src })); }
// rotation entry for the reset that starts at `resetMs`
function lsProject(resetMs){ const a = lsAnchor(), d = Math.round((resetMs - a.day) / 864e5); return LS_CYCLE[(((lsIdx(a.name) + d) % LS_CYCLE.length) + LS_CYCLE.length) % LS_CYCLE.length]; }
const lsProjToday = () => lsProject(lastReset());
const CHAMP_C = { Barrier: '#7fb2ff', Overload: '#c993ff', Unstoppable: '#ffb35c' }, SHIELD_C = { Void: '#b48cff', Arc: '#7fd6ff', Solar: '#ff9e57', Strand: '#5fe39a', Stasis: '#8fb6ff' };
const tagList = (arr, col) => '<span class="lstags">' + (arr.length ? arr.map(x => '<span class="lstag" style="border-color:' + (col[x] || '#555') + '55;color:' + (col[x] || '#ccc') + '">' + esc(x) + '</span>').join('') : '<span class="dim-lbl">Not published, check in game</span>') + '</span>';
function lsProjectionHtml(c, chName){
  const today = lsProjToday(), a = lsAnchor(), calibrated = a.src !== 'schedule';
  const s = q(), match = !s || [today.n, today.dest, ...today.champs, ...today.shields, 'lost sector'].join(' ').toLowerCase().includes(s);
  const days = Array.from({ length: 7 }, (_, i) => { const r = lastReset() + (i + 1) * 864e5; return { r, e: lsProject(r) }; });
  const wd = ms => new Date(ms).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  return (match ? '<div class="lsbox lsproj" data-lsproj="' + esc(today.n) + '"><div class="ab">' +
      '<div class="lsproj-tag">' + (calibrated ? 'Projected from the daily cycle' : 'Projected from the published cycle (estimate)') + '</div>' +
      '<h3>' + esc(today.n) + '</h3><div class="vloc" style="color:#9fe7ff">📍 ' + esc(today.dest) + '</div>' +
      '<div class="lsrow"><span class="dim-lbl">Champions</span>' + tagList(today.champs, CHAMP_C) + '</div>' +
      '<div class="lsrow"><span class="dim-lbl">Shields</span>' + tagList(today.shields, SHIELD_C) + '</div>' +
      '<div class="lsrow"><span class="dim-lbl">Drops</span><span>Solo Expert or Master clear: chance at an Exotic engram (Master has better odds), plus the lost sector\'s legendary weapons. Run Master for the best odds at Tier 5 gear.</span></div>' +
      '<div class="ad">Lost sectors rotate once a day at the daily reset, 17:00 UTC (' + esc(new Date(nextUtc(null)).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })) + ' your time). ' +
        'Bungie\'s API only lists the day\'s Expert and Master lost sector on a character that has already cleared that lost sector on normal in patrol, ' +
        (c ? 'and none of your characters list it today, ' : '') + 'so this card is projected from the rotation order. ' +
        (calibrated ? 'Last confirmed: ' + esc(a.name) + ' on ' + esc(wd(a.day)) + (a.src === 'api' ? ' (seen on your account).' : ' (you picked it).') : 'Not yet confirmed on your account: sign in on a character that has it, or pick today\'s below.') + '</div>' +
      '<div class="lscal"><label class="dim-lbl" for="lsPick">Wrong one? Today it\'s</label> <select id="lsPick">' + LS_CYCLE.map(x => '<option' + (x === today ? ' selected' : '') + '>' + esc(x.n) + '</option>').join('') + '</select></div>' +
    '</div></div>' : '<div class="panel dim-lbl">Today\'s lost sector doesn\'t match the search.</div>') +
    '<div class="panel lsweek"><div class="lsf-title">Next 7 days</div><table class="lsw"><tr><th>Day</th><th>Lost Sector</th><th>Where</th><th>Champions</th><th>Shields</th></tr>' +
      days.map(({ r, e }) => '<tr><td>' + esc(wd(r)) + '</td><td><b>' + esc(e.n) + '</b></td><td>' + esc(e.dest) + '</td><td>' + (esc(e.champs.join(', ')) || '<span class="dim-lbl">?</span>') + '</td><td>' + (esc(e.shields.join(', ')) || '<span class="dim-lbl">?</span>') + '</td></tr>').join('') +
    '</table><div class="dim-lbl" style="margin-top:6px">Each day starts at the reset shown. Projected, so check a calendar if it matters.</div></div>';
}

function renderLost(){
  const el = $('lost');
  if (state.cat !== 'all' && state.cat !== 'lost'){ el.innerHTML = ''; return; }
  const c = state.tchar && state.char[state.tchar];
  const chName = (state.chars.find(x => x.id === state.tchar) || {}).name || 'character';
  const found = lostFromAccount();
  let list = found.map(x => x.g), note = '', other = null;
  if (list.length){
    lsCache(list);
    list.forEach(g => setLsAnchor(g.name, 'api'));   // re-anchor the projection to what Bungie actually shows
    const onSel = found.some(x => x.on === state.tchar);
    if (!onSel){ other = (state.chars || []).find(x => x.id === found[0].on); if (other) note = 'Not listed on your ' + chName + ', but your ' + other.name + ' has it.'; }
  } else { const cached = lsCache(); if (cached && cached.length){ list = cached; note = 'Seen on your account earlier today.'; } }
  const head = '<div class="sect"><h2>Lost Sector today</h2><span class="dim-lbl">Changes at the daily reset (17:00 UTC), in ' + cd(nextUtc(null)) + '.' + (note ? ' ' + esc(note) : '') + '</span></div>';
  if (!list || !list.length){
    // nothing from Bungie: project today's from the rotation, and keep the list of what this character can run
    const lsActs = c ? [...new Map((c.availableActivities || []).filter(a => a.isVisible !== false && isLostSector(a.activityHash)).map(a => [lsBase(a.activityHash) || actName(a.activityHash), a])).entries()] : [];
    const byDest = {};
    for (const [name, a] of lsActs){ const d = where(a.activityHash) || 'Other'; (byDest[d] = byDest[d] || []).push(name); }
    el.innerHTML = head + lsProjectionHtml(c, chName) +
      (lsActs.length ? '<details class="lsall"><summary>Lost sectors your ' + esc(chName) + ' can run (' + lsActs.length + ')</summary><div class="lsdest">' +
        Object.keys(byDest).sort().map(d => '<div><b>' + esc(d) + '</b><span>' + byDest[d].map(esc).join(', ') + '</span></div>').join('') + '</div></details>' : '') +
      (!c && !auth.valid() ? '<div class="dim-lbl" style="margin:6px 2px">Sign in with Bungie to confirm today\'s lost sector from your characters.</div>' : '') + LS_LINKS;
    const pick = $('lsPick');
    if (pick) pick.onchange = () => { setLsAnchor(pick.value, 'manual'); render(); };
  } else {
    const s = q();
    const shown = list.filter(g => !s || [g.name, where(g.hash), ...modNames(g.mods), ...g.rewards.map(nameOf)].join(' ').toLowerCase().includes(s));
    el.innerHTML = head + shown.map(g => {
      const a = T.act[g.hash] || {}, loc = where(g.hash);
      const rw = g.rewards.map(h => (state.defs || {})[h]).filter(d => d && d.n);
      return '<div class="lsbox"><div class="hero" style="background-image:url(\'' + img(a.img) + '\')"></div><div class="ab">' +
        '<h3>' + esc(g.name) + '</h3>' + (loc ? '<div class="vloc" style="color:#9fe7ff">📍 ' + esc(loc) + '</div>' : '') +
        '<div class="diffs">' + g.diffs.map(d => '<span class="diff"><b>' + esc(d.label) + '</b>' + (d.light ? ' · Power ' + d.light : '') + '</span>').join('') + '</div>' +
        modsHtml(g.mods) +
        (rw.length ? '<div class="lsrw">' + rw.map(d => '<span class="rwi">' + (d.i ? '<img decoding="async" src="' + img(d.i) + '" alt="">' : '') + esc(d.n) + '</span>').join('') + '</div>' : '') +
        ((a.d) ? '<div class="ad">' + esc(a.d) + '</div>' : '') +
        (other ? '<div><button class="ghost" data-switch="' + esc(other.id) + '">Switch to your ' + esc(other.name) + '</button></div>' : '') +
        '</div></div>';
    }).join('') + (s && !shown.length ? '<div class="panel dim-lbl">Today\'s lost sector doesn\'t match the search.</div>' : '') + LS_LINKS;
  }
  el.querySelectorAll('[data-switch]').forEach(b => b.onclick = () => { state.tchar = b.dataset.switch; ls.set('todayChar', state.tchar); render(); });
}

/* ---- activity categories (pills) ---- */
const CATS = [['all', 'All'], ['lost', 'Lost Sector'], ['strike', 'Strikes / Nightfall'], ['raid', 'Raids'], ['dungeon', 'Dungeons'], ['pvp', 'Crucible'], ['weekly', 'Weekly / Portal']];
state.cat = ls.get('todayCat') || 'all';
function catsOf(h, weekly){
  const a = T.act[h] || {}, s = [a.n, a.o, actType(h), (T.mode[a.mode] || {}).n].join(' ');
  const out = new Set();
  if (isLostSector(h)) out.add('lost');
  if (/nightfall|\bstrikes?\b|vanguard ops|grandmaster/i.test(s)) out.add('strike');
  if (/\braid\b/i.test(s)) out.add('raid');
  if (/dungeon/i.test(s)) out.add('dungeon');
  if (a.pvp || /crucible|trials of osiris|iron banner|competitive|\bcontrol\b|\bclash\b|rumble|elimination/i.test(s)) out.add('pvp');
  if (weekly) out.add('weekly');   // weekly rotations, Portal-featured, or has weekly challenges
  return out;
}
const catOk = set => state.cat === 'all' || set.has(state.cat);
const msCats = m => { const acts = m.activities || []; const out = new Set(['weekly']); acts.forEach(a => catsOf(a.activityHash, true).forEach(x => out.add(x))); return out; };
const actCats = a => catsOf(a.activityHash, !!(a.isFocusedActivity || (a.challenges || []).length));
function renderCats(){
  // live counts, after the search box is applied
  const seen = new Map();
  for (const m of Object.values(state.pub || {})){
    const md = T.ms[m.milestoneHash] || {}, acts = m.activities || [];
    if (!acts.length && !md.n) continue;
    const okSearch = acts.length ? matches(acts[0].activityHash, [md.n, md.d, ...acts.flatMap(a => modNames(a.modifierHashes))]) : matches(0, [md.n, md.d]);
    if (okSearch) seen.set('ms:' + m.milestoneHash, msCats(m));
  }
  for (const a of state.actsList || []) if (matches(a.activityHash, [...modNames(a.modifierHashes), ...rewardNames(a.visibleRewards)])) seen.set('a:' + actName(a.activityHash), actCats(a));
  // the daily lost sector counts even when it's on another character, and the projected one counts when Bungie lists none
  const acc = lostFromAccount().map(x => x.g), fb = acc.length ? acc : (lsCache() || []);
  if (fb.length){ for (const g of fb) if (![...seen.keys()].includes('a:' + actName(g.hash))) seen.set('ls:' + g.name, new Set(['lost'])); }
  else { const p = lsProjToday(); if (matches(0, [p.n, p.dest, 'lost sector', ...p.champs, ...p.shields])) seen.set('ls:proj', new Set(['lost'])); }
  const n = k => k === 'all' ? seen.size : [...seen.values()].filter(set => set.has(k)).length;
  $('tCat').innerHTML = CATS.map(([k, l]) => '<span class="chip' + (state.cat === k ? ' on' : '') + '" data-cat="' + k + '">' + esc(l) + '<b>' + n(k) + '</b></span>').join('');
  $('tCat').querySelectorAll('[data-cat]').forEach(c => c.onclick = () => {
    state.cat = c.dataset.cat; ls.set('todayCat', state.cat);
    renderLost(); renderWeekly(); renderChar(); renderCats();
    if (state.cat !== 'all') jumpToFirst();
  });
}
// scroll to the first section that has something in this category, and flash it
function jumpToFirst(){
  const el = ['lost', 'weekly', 'featured', 'challenges', 'allActs'].map($).find(e => e && e.innerHTML.trim() && e.querySelector('.act, .lsbox, .lsfall, details'));
  if (!el) return;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

function render(){
  const daily = nextUtc(null), weekly = nextUtc(2), xw = xurWindow();
  $('topinfo').innerHTML =
    '<div class="sum"><span class="dim-lbl">Daily reset</span><b>' + cd(daily) + '</b><span class="dim-lbl">' + fmtWhen(daily) + ' your time</span></div>' +
    '<div class="sum"><span class="dim-lbl">Weekly reset</span><b>' + cd(weekly) + '</b><span class="dim-lbl">' + fmtWhen(weekly) + ' your time</span></div>' +
    (() => { const acc = lostFromAccount().map(x => x.g), l = acc.length ? acc : (lsCache() || []);
      if (l.length) return '<div class="sum"><span class="dim-lbl">Lost Sector today</span><b style="font-size:16px">' + esc(l.map(g => g.name).join(' / ')) + '</b><span class="dim-lbl">' + esc(where(l[0].hash)) + '</span></div>';
      const p = lsProjToday(); return '<div class="sum" title="Projected from the daily rotation"><span class="dim-lbl">Lost Sector today (projected)</span><b style="font-size:16px">' + esc(p.n) + '</b><span class="dim-lbl">' + esc(p.dest) + '</span></div>'; })() +
    '<div class="sum"><span class="dim-lbl">' + (xw.here ? 'Xûr leaves in' : 'Xûr arrives in') + '</span><b>' + cd(xw.here ? xw.leaves : xw.arrives) + '</b><span class="dim-lbl"><a href="vendors.html?v=__BUILD__">Vendors &amp; Xûr →</a></span></div>';
  renderLost(); renderWeekly(); renderChar(); renderCats();
}
function renderWeekly(){
  const el = $('weekly');
  if (!state.pub){ el.innerHTML = ''; return; }
  const ms = Object.values(state.pub).sort((a, b) => (a.order || 0) - (b.order || 0));
  const cards = [];
  for (const m of ms){
    const md = T.ms[m.milestoneHash] || {};
    const acts = m.activities || [];
    if (!acts.length && !md.n) continue;
    if (!catOk(msCats(m))) continue;
    if (!acts.length){
      if (!matches(0, [md.n, md.d])) continue;
      cards.push('<div class="act"><div class="hero" style="background-image:url(\'' + img(md.img) + '\')"><span class="ty">Weekly</span></div><div class="ab"><div class="an">' + (md.i ? '<img decoding="async" src="' + img(md.i) + '" alt="">' : '') + esc(md.n || 'Milestone') + '</div>' +
        (md.d ? '<div class="ad">' + esc(md.d) + '</div>' : '') + endsTxt(m.endDate) + '</div></div>');
      continue;
    }
    // one card per milestone: its first activity, with the modifiers and challenges they share
    const a0 = acts[0];
    if (!matches(a0.activityHash, [md.n, md.d, ...acts.flatMap(a => modNames(a.modifierHashes))])) continue;
    const variants = [...new Set(acts.map(a => actName(a.activityHash)).filter(Boolean))];
    cards.push(actCard(a0.activityHash, {
      title: md.n || actName(a0.activityHash), type: 'This week', image: (T.act[a0.activityHash] || {}).img || md.img,
      desc: md.d || undefined, sub: variants.length > 1 ? variants.slice(0, 6).join(' · ') + (variants.length > 6 ? ' …' : '') : (variants[0] && variants[0] !== md.n ? variants[0] : ''),
      ends: endsTxt(m.endDate), mods: acts.flatMap(a => a.modifierHashes || []),
      chal: [...new Set(acts.flatMap(a => a.challengeObjectiveHashes || []))].map(h => ({ objectiveHash: h }))
    }));
  }
  if (!cards.length && state.cat !== 'all'){ el.innerHTML = ''; return; }
  el.innerHTML = '<div class="sect"><h2>This week</h2><span class="dim-lbl">Weekly rotations from Bungie, the same for everyone. They change at the weekly reset.</span></div>' +
    (cards.length ? '<div class="agrid">' + cards.join('') + '</div>' : '<div class="panel dim-lbl">Nothing matches the search.</div>');
}
function renderChar(){
  const c = state.tchar && state.char[state.tchar];
  if (!auth.valid() || !c){
    $('toolbar').classList.toggle('hidden', !state.pub);
    $('tChar').innerHTML = '<span class="dim-lbl">Sign in with Bungie to pick a character.</span>';
    $('featured').innerHTML = state.pub && !auth.valid() ? '<div class="panel signin" style="margin-top:18px">Sign in with Bungie (top right) to add what your characters can play right now: featured activities, weekly challenges with your progress, modifiers and rewards.</div>' : '';
    $('challenges').innerHTML = ''; $('allActs').innerHTML = ''; state.actsList = [];
    return;
  }
  $('toolbar').classList.remove('hidden');
  $('tChar').innerHTML = state.chars.map(ch => '<span class="chip ' + (ch.id === state.tchar ? 'on' : '') + '" data-c="' + ch.id + '">' + esc(ch.name) + (ch.light ? ' <b>' + ch.light + '</b>' : '') + '</span>').join('');
  $('tChar').querySelectorAll('.chip').forEach(x => x.onclick = () => { state.tchar = x.dataset.c; ls.set('todayChar', state.tchar); render(); });
  const list = (c.availableActivities || []).filter(a => a.isVisible !== false && actName(a.activityHash));
  // same name, several difficulty variants: keep one card (the featured or highest-power one)
  const byName = new Map();
  for (const a of list){
    const n = actName(a.activityHash), cur = byName.get(n);
    if (!cur || (a.isFocusedActivity && !cur.isFocusedActivity) || ((a.challenges || []).length > (cur.challenges || []).length) || (!cur.isFocusedActivity && (a.recommendedLight || 0) > (cur.recommendedLight || 0))) byName.set(n, a);
  }
  const acts = [...byName.values()];
  state.nActs = acts.length; state.actsList = acts;
  const extra = a => ({ feat: a.isFocusedActivity, light: a.recommendedLight, mods: a.modifierHashes, chal: a.challenges, rewards: a.visibleRewards,
    done: a.isCompleted && !(a.challenges || []).some(x => x.objective && !x.objective.complete) });
  const ok = a => catOk(actCats(a)) && matches(a.activityHash, [...modNames(a.modifierHashes), ...rewardNames(a.visibleRewards)]);
  const feat = acts.filter(a => a.isFocusedActivity && ok(a));
  $('featured').innerHTML = !feat.length && state.cat !== 'all' ? '' : '<div class="sect"><h2>Featured right now</h2><span class="dim-lbl">What the Portal is spotlighting for your ' + esc((state.chars.find(x => x.id === state.tchar) || {}).name || '') + '.</span></div>' +
    (feat.length ? '<div class="agrid">' + feat.map(a => actCard(a.activityHash, extra(a))).join('') + '</div>' : '<div class="panel dim-lbl">' + (q() ? 'Nothing featured matches the search.' : 'Bungie isn\'t flagging any featured activities for this character.') + '</div>');
  const ch = acts.filter(a => (a.challenges || []).length && !a.isFocusedActivity && ok(a))
    .sort((x, y) => (x.challenges.every(c => c.objective && c.objective.complete) ? 1 : 0) - (y.challenges.every(c => c.objective && c.objective.complete) ? 1 : 0));
  $('challenges').innerHTML = ch.length ? '<div class="sect"><h2>Weekly challenges</h2><span class="dim-lbl">Activities with challenges this week, with your progress. Finished ones are faded and sorted last.</span></div><div class="agrid">' + ch.map(a => actCard(a.activityHash, extra(a))).join('') + '</div>' : '';
  const groups = {};
  for (const a of acts){ if (!ok(a)) continue; (groups[actType(a.activityHash)] = groups[actType(a.activityHash)] || []).push(a); }
  const keys = Object.keys(groups).sort((x, y) => groups[y].length - groups[x].length || x.localeCompare(y));
  const open = new Set(JSON.parse(ls.get('todayOpen') || '[]'));
  const filtered = q() || state.cat !== 'all';
  const shown = keys.reduce((n, k) => n + groups[k].length, 0);
  const catName = (CATS.find(c => c[0] === state.cat) || [])[1] || '';
  $('allActs').innerHTML = '<div class="sect"><h2>Everything you can play</h2><span class="dim-lbl">' + (state.cat !== 'all' ? shown + ' ' + esc(catName) + ' activities' : acts.length + ' activities, grouped by type. Click a group to open it.') + '</span></div>' +
    (!keys.length && filtered ? '<div class="panel dim-lbl">Nothing ' + (state.cat !== 'all' ? 'in ' + esc(catName) : 'matching') + ' for your ' + esc((state.chars.find(x => x.id === state.tchar) || {}).name || 'character') + ' right now.' + (state.cat !== 'all' ? ' Try All, or another character.' : '') + '</div>' : '') +
    '<div class="modelist">' +
    keys.map(k => '<details data-k="' + esc(k) + '"' + (open.has(k) || filtered ? ' open' : '') + '><summary>' + esc(k) + '<b>' + groups[k].length + '</b></summary><div class="agrid">' +
      groups[k].sort((x, y) => actName(x.activityHash).localeCompare(actName(y.activityHash))).map(a => actCard(a.activityHash, extra(a))).join('') + '</div></details>').join('') + '</div>';
  $('allActs').querySelectorAll('details[data-k]').forEach(d => d.ontoggle = () => {
    if (q() || state.cat !== 'all') return;
    const s = new Set(JSON.parse(ls.get('todayOpen') || '[]')); d.open ? s.add(d.dataset.k) : s.delete(d.dataset.k); ls.set('todayOpen', JSON.stringify([...s]));
  });
}
let searchT = 0;
$('tSearch').oninput = () => { clearTimeout(searchT); searchT = setTimeout(() => { renderLost(); renderWeekly(); renderChar(); renderCats(); }, 150); };

/* ===================== footer, refresh, countdowns ===================== */
function updateFooter(){
  $('sitefoot').innerHTML = ['<b>Rotations:</b> Bungie.net API (public milestones) · <b>Your activities:</b> Bungie.net API (character activities, signed in)',
    '<b>Names, images, modifiers:</b> Bungie manifest ' + (state.manVer ? '<code>' + esc(state.manVer) + '</code>' : '(loads on first visit)'),
    'Not affiliated with Bungie'].join('<br>');
}
$('autoRefresh').checked = ls.get('autoRefresh') !== '0';
$('autoRefresh').onchange = () => { ls.set('autoRefresh', $('autoRefresh').checked ? '1' : '0'); tickRefresh(); };
const REFRESH_SECS = 60;
function autoRefreshOk(minAge){ return $('autoRefresh').checked && state.acct && auth.valid() && !state.scanning && !document.hidden && Date.now() - (state.lastScan || 0) > minAge; }
window.addEventListener('focus', () => { if (autoRefreshOk(15e3)) scan({ silent: true }); });
function tickRefresh(){
  document.querySelectorAll('[data-cd]').forEach(e => e.textContent = left(+e.dataset.cd));
  if (state.pub && Date.now() >= state.pubDue && !state.scanning){ scan({ silent: true }); return; }   // reset passed: reload rotations
  const el = $('lastScan'); if (!el || !state.lastScan) return;
  const fmt = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  const base = 'Rotations ' + fmt(state.pubAt) + (state.acct ? ' · your activities ' + fmt(state.lastScan) : '');
  if (!state.acct || !$('autoRefresh').checked){ el.textContent = base + (state.acct ? ' · auto-refresh off' : ''); return; }
  if (state.scanning){ el.textContent = base + ' · refreshing now'; return; }
  const s = Math.max(0, Math.ceil((state.lastScan + REFRESH_SECS * 1000 - Date.now()) / 1000));
  el.textContent = base + ' · next refresh in ' + s + 's';
  if (s === 0 && autoRefreshOk(REFRESH_SECS * 1000 - 500)) scan({ silent: true });
}
setInterval(tickRefresh, 1000);

/* ===================== activity stream hooks (stream.js) ===================== */
/* ---- keep the Bungie sign-in going ----
   Public Bungie apps get about 1 hour tokens and no refresh token. After someone has signed in once (localStorage
   authAuto = '1'), an expired or nearly expired token is renewed with a quick trip through bungie.net, which skips the
   Approve screen for apps the user already approved. Never mid-scan, never in a hidden tab, and at most once every
   3 minutes per tab (sessionStorage renewAt) so a Bungie problem can't cause a redirect loop. Sign out clears authAuto. */
let lastInput = Date.now();
['pointerdown', 'keydown', 'wheel'].forEach(t => addEventListener(t, () => { lastInput = Date.now(); }, { passive: true }));
/* autoRenew: core.js */
setInterval(autoRenew, 30e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoRenew(); });
autoRenew();

const PAGE = 'today';
const streamInfo = null, streamOpen = null;
const byId = () => null;
const runAction = () => {};

updateFooter();
updateAuthUi();
render();
if (ls.get('apiKey')) scan(); else setStatus('Add your Bungie API key in Settings (on the Weapons page) first.', true);
</script>
<script src="stream.js?v=__BUILD__"></script>
